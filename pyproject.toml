[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oktigent"
version = "0.1.0"
description = "Agentic coding tool for the terminal — smarter than the rest."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "oktigent contributors" },
]
keywords = ["ai", "coding", "agent", "terminal", "tui", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "textual>=0.80,<1.0",
    "rich>=13.0,<14.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.19,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
oktigent = "oktigent.__main__:main"

[project.urls]
Homepage = "https://github.com/oktigent/oktigent"

[tool.hatch.build.targets.wheel]
packages = ["oktigent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
