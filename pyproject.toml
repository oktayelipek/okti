[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okti"
version = "0.3.0"
description = "Agentic coding tool for the terminal — smarter than the rest."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "okti contributors" },
]
keywords = ["ai", "coding", "agent", "terminal", "tui", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "textual>=0.80,<1.0",
    "rich>=13.0,<14.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.19,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "bandit[toml]>=1.7",
    "mypy>=1.11",
    "pre-commit>=3.5",
]

[project.scripts]
okti = "okti.__main__:main"

[project.urls]
Homepage = "https://github.com/oktayelipek/okti"

[tool.hatch.build.targets.wheel]
packages = ["okti"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in argument defaults (pydantic uses this)
    "B007",  # unused loop control variable — noise
    "SIM105", # contextlib.suppress preference — style choice
    "SIM117", # nested with statements — readable at times
    "UP042",  # replace StrEnum — pydantic compat
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "E402", "F841"]
"okti/tui/*" = ["SIM103", "SIM118"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["okti"]
branch = true
omit = [
    "okti/tui/*",
    "okti/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]  # assert_used — legitimate in tests & guard clauses

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["okti"]
