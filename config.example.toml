# okti configuration file
# Place at ~/.config/okti/config.toml

# Default provider: ollama, openai, anthropic, gemini, deepseek, openrouter, xai
default_provider = "ollama"

# Default model (provider-specific)
default_model = "codellama"

# Permissions
[permissions]
yolo = false
# Custom rules (optional):
# [[permissions.rules]]
# tool = "run_command"
# level = "ask"  # allow, ask, deny

# Context management
[context]
max_tokens = 128000
compaction_threshold = 0.75
background_max_chars = 50000

# Sessions
auto_save = true  # auto-save after each assistant turn (default: true)
# Use --no-auto-save CLI flag or auto_save = false to disable

# Plugins — DISABLED BY DEFAULT.
# Plugins execute arbitrary Python with process privileges. To enable:
#   1. Compute the SHA256 of each plugin file:
#        python -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" <file>
#   2. Add each hash below.
#   3. Set enabled = true.
# Any edit to a plugin file invalidates its hash and requires re-approval.
[plugins]
enabled = false
trusted_hashes = []
# allow_untrusted = false  # dev/CI escape hatch — do NOT use in production

# Provider configurations
[providers.ollama]
base_url = "http://localhost:11434"

[providers.openai]
# api_key = "sk-..."  # Or set OPENAI_API_KEY env var
model = "gpt-4o"

[providers.anthropic]
# api_key = "sk-ant-..."  # Or set ANTHROPIC_API_KEY env var
model = "claude-sonnet-4-20250514"

[providers.gemini]
# api_key = "..."  # Or set GOOGLE_API_KEY env var
model = "gemini-2.5-flash"

[providers.deepseek]
# api_key = "..."  # Or set DEEPSEEK_API_KEY env var
model = "deepseek-chat"

[providers.openrouter]
# api_key = "..."  # Or set OPENROUTER_API_KEY env var

[providers.xai]
# api_key = "..."  # Or set XAI_API_KEY env var
